name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version
      - name: Text guard
        run: python3 scripts/check_clean.py
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Legacy basis against the snapshot
        run: |
          cargo run --release -p nush2_cli -- export --out "$RUNNER_TEMP/legacy" --basis legacy
          python3 scripts/compare_results.py engine/vv/data/legacy_results "$RUNNER_TEMP/legacy" \
            --subset \
            --names Economic_Ledger.csv Emissions_Ledger.csv Final_Design_Basis.csv \
              Integrated_Energy_Balance.csv Integrated_Mass_Balance.csv Sensitivity_Results.csv \
              Validation_Results.csv \
            --allow-cell Validation_Results.csv:PARAMS_COMPLETE:conditions \
            --allow-cell Validation_Results.csv:EXPORT_BYTE_IDENTICAL:conditions
      - name: Default basis against results
        run: |
          cargo run --release -p nush2_cli -- export --out "$RUNNER_TEMP/results"
          python3 scripts/compare_results.py results "$RUNNER_TEMP/results"
